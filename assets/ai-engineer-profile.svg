<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2450" viewBox="0 0 1400 2450">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#06040d"/>
    <stop offset="0.52" stop-color="#0d081b"/>
    <stop offset="1" stop-color="#160b2d"/>
  </linearGradient>
  <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#6d28d9"/>
    <stop offset="0.5" stop-color="#a855f7"/>
    <stop offset="1" stop-color="#c084fc"/>
  </linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#a855f7"/>
    <stop offset="1" stop-color="#c084fc"/>
  </linearGradient>
  <radialGradient id="glow">
    <stop offset="0" stop-color="#7c3aed" stop-opacity=".35"/>
    <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
  </radialGradient>
  <filter id="shadow">
    <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity=".55"/>
  </filter>
  <filter id="soft">
    <feGaussianBlur stdDeviation="28"/>
  </filter>
  <style>
    .title{font-family:Arial,Helvetica,sans-serif;font-weight:700;fill:#f5f3ff}
    .sub{font-family:Arial,Helvetica,sans-serif;fill:#cbd5e1}
    .purple{fill:#c084fc}
    .muted{fill:#94a3b8}
    .card{fill:#0b0815;fill-opacity:.92;stroke:#35205a;stroke-width:1.5}
    .small{font-family:Arial,Helvetica,sans-serif;font-size:18px}
    .body{font-family:Arial,Helvetica,sans-serif;font-size:20px;fill:#cbd5e1}
  </style>
</defs>

