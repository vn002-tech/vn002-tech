<svg width="1000" height="420" viewBox="0 0 1000 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="pipe-petrol-bg" x1="0" y1="0" x2="1000" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080E17"/>
      <stop offset="50%" stop-color="#0E1724"/>
      <stop offset="100%" stop-color="#070C14"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="pipe-card-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141E2C"/>
      <stop offset="100%" stop-color="#0E1520"/>
    </linearGradient>

    <linearGradient id="pipe-llm-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#132F2E"/>
      <stop offset="100%" stop-color="#0C1D1C"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="p-glow-teal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace; }

    @keyframes flow-fwd {
      0% { stroke-dashoffset: 24; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 0.35; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    @keyframes radar-ring {
      0% { r: 4px; opacity: 1; }
      100% { r: 11px; opacity: 0; }
    }

    .anim-flow-fwd {
      stroke-dasharray: 6 4;
      animation: flow-fwd 1.4s linear infinite;
    }

    .anim-pulse {
      animation: pulse-dot 2.2s ease-in-out infinite;
    }

    .anim-radar-teal {
      animation: radar-ring 1.8s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
  </style>

  <!-- Container Frame -->
  <rect x="2" y="2" width="996" height="416" rx="16" fill="url(#pipe-petrol-bg)" stroke="#1E2C3D" stroke-width="1.5"/>

  <!-- ================= SECTION LABELS ================= -->
  <text x="35" y="32" fill="#64748B" class="font-mono" font-size="10.5" font-weight="700" letter-spacing="1.5">TIER 1: DATA &amp; FEATURE FOUNDATION</text>
  <text x="35" y="160" fill="#38BDF8" class="font-mono" font-size="10.5" font-weight="700" letter-spacing="1.5">TIER 2: INTELLIGENCE &amp; MODELING BRANCHES (ML &amp; DATA SCIENCE · DL · LLM)</text>
  <text x="35" y="300" fill="#FBBF24" class="font-mono" font-size="10.5" font-weight="700" letter-spacing="1.5">TIER 3: SERVING, AGENTS &amp; AI AUTOMATION</text>

  <!-- ================= TIER 1: DATA FOUNDATION ================= -->
  <!-- 01. Ingestion -->
  <g transform="translate(35, 45)">
    <rect width="430" height="75" rx="10" fill="url(#pipe-card-grad)" stroke="#334A66" stroke-width="1.2"/>
    <circle cx="22" cy="22" r="4" fill="#38BDF8" class="anim-pulse"/>
    <text x="36" y="26" fill="#38BDF8" class="font-mono" font-size="11" font-weight="700">01. DATA INGESTION &amp; VALIDATION</text>
    <text x="22" y="47" fill="#F8FAFC" class="font-sans" font-size="13" font-weight="600">ETL Pipelines &amp; Schema Integrity</text>
    <text x="22" y="65" fill="#94A3B8" class="font-sans" font-size="11">PostgreSQL · Automated Data Cleaning · Assertions</text>
  </g>

  <!-- Flow Line Tier 1 (1 to 2) -->
  <line x1="465" y1="82" x2="535" y2="82" stroke="#F59E0B" stroke-width="2" class="anim-flow-fwd"/>
  <polygon points="535,82 527,78 527,86" fill="#FBBF24"/>

  <!-- 02. Feature & Embedding Matrix -->
  <g transform="translate(535, 45)">
    <rect width="430" height="75" rx="10" fill="url(#pipe-card-grad)" stroke="#D97706" stroke-width="1.2"/>
    <circle cx="22" cy="22" r="4" fill="#FBBF24" class="anim-pulse"/>
    <text x="36" y="26" fill="#FBBF24" class="font-mono" font-size="11" font-weight="700">02. FEATURE &amp; EMBEDDING PIPELINE</text>
    <text x="22" y="47" fill="#F8FAFC" class="font-sans" font-size="13" font-weight="600">Encoders, Scaling &amp; Vectorization</text>
    <text x="22" y="65" fill="#94A3B8" class="font-sans" font-size="11">Scikit-learn · Pandas · Dense Representations</text>
  </g>

  <!-- Connectors from Tier 1 (02) down to Tier 2 (3 branches) -->
  <path d="M750 120 V145 H175 V175" stroke="#64748B" stroke-width="1.5" class="anim-flow-fwd"/>
  <path d="M750 120 V175" stroke="#38BDF8" stroke-width="1.8" class="anim-flow-fwd"/>
  <path d="M750 120 V145 H825 V175" stroke="#2DD4BF" stroke-width="2" class="anim-flow-fwd"/>

  <!-- ================= TIER 2: 3 CORE INTELLIGENCE BRANCHES ================= -->

  <!-- Branch A: ML & Data Science -->
  <g transform="translate(35, 175)">
    <rect width="280" height="85" rx="10" fill="url(#pipe-card-grad)" stroke="#0284C7" stroke-width="1.2"/>
    <circle cx="20" cy="22" r="4" fill="#38BDF8" class="anim-pulse"/>
    <text x="32" y="26" fill="#38BDF8" class="font-mono" font-size="10.5" font-weight="700">03A. ML &amp; DATA SCIENCE</text>
    <text x="20" y="49" fill="#F8FAFC" class="font-sans" font-size="12.5" font-weight="600">Statistical Modeling &amp; Prediction</text>
    <text x="20" y="68" fill="#94A3B8" class="font-sans" font-size="10.5">XGBoost · Scikit-learn · EDA &amp; Analysis</text>
  </g>

  <!-- Branch B: Deep Learning -->
  <g transform="translate(360, 175)">
    <rect width="280" height="85" rx="10" fill="url(#pipe-card-grad)" stroke="#D97706" stroke-width="1.2"/>
    <circle cx="20" cy="22" r="4" fill="#FBBF24" class="anim-pulse"/>
    <text x="32" y="26" fill="#FBBF24" class="font-mono" font-size="10.5" font-weight="700">03B. DEEP LEARNING</text>
    <text x="20" y="49" fill="#F8FAFC" class="font-sans" font-size="12.5" font-weight="600">Neural &amp; Dense Networks</text>
    <text x="20" y="68" fill="#94A3B8" class="font-sans" font-size="10.5">PyTorch · Tensors · Embeddings</text>
  </g>

  <!-- Branch C: LLM & AI Automation (FOCAL POINT) -->
  <g transform="translate(685, 175)">
    <rect width="280" height="85" rx="10" fill="url(#pipe-llm-grad)" stroke="#2DD4BF" stroke-width="1.5" filter="url(#p-glow-teal)"/>
    <circle cx="20" cy="22" r="4" fill="#5EEAD4"/>
    <circle cx="20" cy="22" r="4" fill="#2DD4BF" class="anim-radar-teal"/>
    <text x="32" y="26" fill="#99F6E4" class="font-mono" font-size="10.5" font-weight="700">03C. LLMs &amp; AUTOMATION</text>
    <text x="20" y="49" fill="#FFFFFF" class="font-sans" font-size="12.5" font-weight="700">RAG &amp; Autonomous Agents</text>
    <text x="20" y="68" fill="#CCFBF1" class="font-sans" font-size="10.5">Vector Search · Tool Use · Chains</text>
  </g>

  <!-- Connectors from Tier 2 down to Tier 3 -->
  <path d="M175 260 V285 H330 V315" stroke="#64748B" stroke-width="1.5" class="anim-flow-fwd"/>
  <path d="M500 260 V315" stroke="#F59E0B" stroke-width="1.8" class="anim-flow-fwd"/>
  <path d="M825 260 V285 H670 V315" stroke="#2DD4BF" stroke-width="2" class="anim-flow-fwd"/>

  <!-- ================= TIER 3: SERVING, AGENTS & AUTOMATION ================= -->

  <!-- 04. Evaluation & Metrics -->
  <g transform="translate(35, 315)">
    <rect width="280" height="85" rx="10" fill="url(#pipe-card-grad)" stroke="#334A66" stroke-width="1.2"/>
    <circle cx="20" cy="22" r="4" fill="#94A3B8" class="anim-pulse"/>
    <text x="32" y="26" fill="#94A3B8" class="font-mono" font-size="10.5" font-weight="700">04. EVALUATION &amp; METRICS</text>
    <text x="20" y="49" fill="#F8FAFC" class="font-sans" font-size="12.5" font-weight="600">Empirical Validation</text>
    <text x="20" y="68" fill="#94A3B8" class="font-sans" font-size="10.5">ROC-AUC · Recall · Benchmark Cost</text>
  </g>

  <!-- 05. FastAPI Serving -->
  <g transform="translate(360, 315)">
    <rect width="280" height="85" rx="10" fill="url(#pipe-card-grad)" stroke="#EA580C" stroke-width="1.2"/>
    <circle cx="20" cy="22" r="4" fill="#FB923C" class="anim-pulse"/>
    <text x="32" y="26" fill="#FB923C" class="font-mono" font-size="10.5" font-weight="700">05. FASTAPI SERVING</text>
    <text x="20" y="49" fill="#F8FAFC" class="font-sans" font-size="12.5" font-weight="600">Async Inference Endpoints</text>
    <text x="20" y="68" fill="#94A3B8" class="font-sans" font-size="10.5">REST APIs · Docker Containerization</text>
  </g>

  <!-- 06. Autonomous AI Applications & UI -->
  <g transform="translate(685, 315)">
    <rect width="280" height="85" rx="10" fill="url(#pipe-card-grad)" stroke="#D97706" stroke-width="1.2"/>
    <circle cx="20" cy="22" r="4" fill="#FBBF24" class="anim-pulse"/>
    <text x="32" y="26" fill="#FBBF24" class="font-mono" font-size="10.5" font-weight="700">06. AI APPS &amp; AUTOMATION</text>
    <text x="20" y="49" fill="#F8FAFC" class="font-sans" font-size="12.5" font-weight="600">Client UI &amp; Workflows</text>
    <text x="20" y="68" fill="#94A3B8" class="font-sans" font-size="10.5">Streamlit · Real-Time Trigger Agents</text>
  </g>
</svg>